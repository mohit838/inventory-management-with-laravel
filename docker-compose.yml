services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inv-app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - inv-network
    ports:
      - "8000:80"

  redis:
    image: redis:alpine
    container_name: inv-redis
    restart: unless-stopped
    networks:
      - inv-network

networks:
  inv-network:
    driver: bridge
